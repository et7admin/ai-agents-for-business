# yaml-language-server: $schema=../../schemas/kpi.schema.json
# kpis.md is generated from this file by `npm run build`.
department: sales
kpis:
  - id: SAL-KPI-001
    name: Speed to lead
    category: leading
    definition: Time from an inbound lead arriving to the first meaningful human (or approved) response.
    formula: median(first response timestamp − lead created timestamp) for inbound leads in the period
    unit: minutes
    direction: lower
    frequency: weekly
    owner: sales-development-rep
    data_source: CRM lead created date and first logged activity
    starter_target: Within business hours, under 60 minutes; aim for under 15 once the process is stable
    pitfalls: Auto-replies don't count as a response. Measure in business hours or report both.

  - id: SAL-KPI-002
    name: Lead-to-opportunity conversion
    category: leading
    definition: Share of leads that become a Stage 1 Qualified opportunity.
    formula: leads converted to opportunities ÷ leads worked × 100, by lead source
    unit: percent
    direction: higher
    frequency: monthly
    owner: sales-development-rep
    data_source: CRM lead status and opportunity created date
    pitfalls: Rises artificially if weak leads are converted to hit the number. Pair with SAL-KPI-004.

  - id: SAL-KPI-003
    name: Meetings held
    category: leading
    definition: First meetings (discovery calls) that actually took place with a qualified contact.
    formula: count of discovery meetings with status "held" in the period, per seller
    unit: count
    direction: higher
    frequency: weekly
    owner: sales-development-rep
    data_source: Calendar and CRM meeting activities
    pitfalls: Count held meetings, not booked ones. Track the no-show rate separately.

  - id: SAL-KPI-004
    name: Win rate
    category: lagging
    definition: Share of closed opportunities that were won.
    formula: closed won ÷ (closed won + closed lost) × 100, counting opportunities that reached Stage 2 or later
    unit: percent
    direction: higher
    frequency: monthly
    owner: head-of-sales
    data_source: CRM closed opportunities
    pitfalls: Leaving stale deals open instead of closing them lost inflates win rate. Enforce SAL-SOP-007.

  - id: SAL-KPI-005
    name: Average deal size
    category: lagging
    definition: Average value of won deals.
    formula: total value of closed won deals ÷ number of closed won deals
    unit: currency
    direction: higher
    frequency: monthly
    owner: head-of-sales
    data_source: CRM closed won amounts (first-year contract value unless the business defines otherwise)
    pitfalls: State which value is used (first-year, total contract, monthly recurring) and keep it consistent.

  - id: SAL-KPI-006
    name: Sales cycle length
    category: efficiency
    definition: Time from opportunity creation to closed won.
    formula: median(closed won date − opportunity created date) in days
    unit: days
    direction: lower
    frequency: monthly
    owner: head-of-sales
    data_source: CRM opportunity dates
    pitfalls: Use the median, not the mean. One long enterprise deal distorts averages.

  - id: SAL-KPI-007
    name: Pipeline coverage
    category: leading
    definition: How much open, qualified pipeline exists compared with the remaining target for the period.
    formula: open pipeline value (Stage 2+) closing in the period ÷ remaining target for the period
    unit: ratio
    direction: target
    frequency: weekly
    owner: sales-manager
    data_source: CRM open opportunities with close dates in the period; targets in business context
    starter_target: About 3× when win rate is near 33%. Set it to 1 ÷ your win rate.
    pitfalls: Stale or unqualified deals make coverage look healthy. Count Stage 2+ only.

  - id: SAL-KPI-008
    name: Forecast accuracy
    category: quality
    definition: How close the committed forecast at the start of the period was to the actual result.
    formula: (1 − |actual closed won − forecast committed at period start| ÷ forecast committed) × 100
    unit: percent
    direction: higher
    frequency: monthly
    owner: sales-manager
    data_source: Forecast snapshots from SAL-SOP-005 and CRM closed won totals
    starter_target: Within ±10% of the commit
    pitfalls: Take the snapshot at the same point each period, or the measure means nothing.

  - id: SAL-KPI-009
    name: Pipeline velocity
    category: efficiency
    definition: Expected revenue the pipeline produces per day.
    formula: (qualified opportunities × win rate × average deal size) ÷ sales cycle length in days
    unit: currency
    direction: higher
    frequency: monthly
    owner: head-of-sales
    data_source: SAL-KPI-002, SAL-KPI-004, SAL-KPI-005, SAL-KPI-006
    pitfalls: A diagnostic, not a target. Use it to see which of the four levers to pull.

  - id: SAL-KPI-010
    name: Quota attainment
    category: lagging
    definition: Closed won value as a share of each seller's target.
    formula: closed won value ÷ quota × 100, per seller and for the team
    unit: percent
    direction: higher
    frequency: monthly
    owner: head-of-sales
    data_source: CRM closed won; quotas in business context or the compensation plan
    pitfalls: Look at the spread across sellers, not just the team total.

  - id: SAL-KPI-011
    name: Outbound positive reply rate
    category: leading
    definition: Share of prospects contacted through outbound who replied with interest.
    formula: prospects with a positive reply ÷ prospects contacted × 100, per sequence
    unit: percent
    direction: higher
    frequency: weekly
    owner: sales-development-rep
    data_source: Email / sales engagement tool and CRM
    pitfalls: Count positive replies only. Track bounce and opt-out rates as guardrails.

  - id: SAL-KPI-012
    name: CRM data completeness
    category: quality
    definition: Share of open opportunities that have every required field filled and a next step dated in the future.
    formula: open opportunities passing all SAL-SOP-007 checks ÷ open opportunities × 100
    unit: percent
    direction: higher
    frequency: weekly
    owner: sales-operations
    data_source: CRM audit from the audit-crm-hygiene skill
    starter_target: 90% or more
    pitfalls: Required fields filled with placeholders ("TBD", "1/1/2030") pass naive checks. The audit must catch them.

  - id: SAL-KPI-013
    name: Proposal win rate
    category: lagging
    definition: Share of sent proposals that were won.
    formula: closed won deals that reached Stage 4 ÷ closed deals that reached Stage 4 × 100
    unit: percent
    direction: higher
    frequency: monthly
    owner: account-executive
    data_source: CRM stage history
    pitfalls: A low rate often means proposals are sent before discovery is complete.

  - id: SAL-KPI-014
    name: Handoff completeness
    category: quality
    definition: Share of closed won deals handed to delivery with a complete handoff package within one business day.
    formula: won deals with all SAL-SOP-006 checklist items done within 1 business day ÷ won deals × 100
    unit: percent
    direction: higher
    frequency: monthly
    owner: account-executive
    data_source: Handoff records and delivery team confirmation
    starter_target: 95% or more
    pitfalls: Ask delivery to confirm. A handoff isn't complete because sales says so.

  - id: SAL-KPI-015
    name: Win/loss review coverage
    category: quality
    definition: Share of significant closed deals that got a documented win/loss review.
    formula: deals reviewed under SAL-SOP-008 ÷ deals meeting the review threshold × 100
    unit: percent
    direction: higher
    frequency: quarterly
    owner: head-of-sales
    data_source: Win/loss review records
    starter_target: 100% of losses above the review threshold, and a sample of wins
